<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robots</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #141a22; }
      #app canvas { display: block; }
      /* The world's status line: time, speed and the robot you control or watch. With Debug on, the raw text. */
      #hud {
        position: absolute; top: 10px; left: 12px; color: #a9afb6;
        font: 12px/1.5 "SF Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre;
        pointer-events: none; user-select: none; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
      }
      #hud.debug { color: #d8dee9; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
