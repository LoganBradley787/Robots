name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm sim determinism car --seconds 10
      - run: pnpm sim determinism hopper --seconds 8 --keys "d:0-3, w:1-1.3, a:4-6"
      - run: pnpm sim determinism drone --seconds 10 --keys "a:2-3, w:5-6, h:8"
