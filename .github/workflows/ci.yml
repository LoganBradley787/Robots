name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm sim determinism car --seconds 10
      - run: pnpm sim determinism hopper --seconds 8 --keys "d:0-3, w:1-1.3, a:4-6"
      - run: pnpm sim determinism drone --seconds 10 --keys "a:2-3, w:5-6, h:8"
      - run: pnpm sim determinism longcar --x -100 --y 1.5 --seconds 6 --keys "d:0-6" --drop bomb@2:-77,4.95
      - run: pnpm sim determinism launcher --x -100 --y 1.5 --seconds 5 --keys "f:2" --drop wall@0:-80,5.5
      - run: pnpm sim determinism missile-drone --x -100 --y 3 --seconds 12 --keys "w:0.5-3.5, f:6, f:9"
